name: SiFi
description: 'SiFi (الحلول المبسطة المالية) is a Saudi Arabian fintech company offering a
  comprehensive corporate spend-management platform for businesses in the Kingdom. Licensed by
  the Saudi Central Bank (SAMA) and serving more than 5,000 clients, SiFi provides physical and
  virtual corporate cards with spending controls, real-time expense tracking, employee
  reimbursements, accounting automation, local vendor payments and international transfers
  (coming soon), and a cashback rewards program, delivered through web and iOS/Android mobile
  apps. SiFi is backed by QED Investors. No public developer API or documentation surface was
  found during this enrichment pass.'
